# ============================================================================
#  OpsMonitor 监控端（server）· Docker Compose
# ----------------------------------------------------------------------------
#  用法（在本目录下）：
#    cp .env.example .env    # 至少要改 OPSM_TOKEN / OPSM_ADMIN_PASS / OPSM_LICENSE_MACHINE
#    docker compose up -d
#    docker compose logs -f
#
#  数据落在 ./data/，采集端发布物落在 ./releases/，删容器不丢数据。
# ============================================================================

services:
  opsmonitor:
    build:
      # 构建上下文必须是仓库根目录（Dockerfile.binary 要读 release/<版本>/ 里的二进制）
      context: ../..
      dockerfile: deploy/docker/Dockerfile.binary
      args:
        VERSION: "1.1.0"

    # 想改成「从源码构建」就注释掉上面的 build 段，改用下面这段：
    # build:
    #   context: ../..
    #   dockerfile: deploy/docker/Dockerfile
    #   args:
    #     VERSION: "1.1.0"
    #     BUILD_TIME: "2026-10-12T10:49:43"

    image: opsmonitor/opsmonitor-server:1.1.0
    container_name: opsmonitor-server
    restart: unless-stopped

    ports:
      - "9999:9999"

    volumes:
      - ./data:/data          # SQLite 数据库
      - ./releases:/releases  # 采集端发布物缓存

    environment:
      TZ: Asia/Shanghai
      OPSM_ADDR: ":9999"
      OPSM_DB: "/data/opsmonitor.db"
      OPSM_RELEASE_DIR: "/releases"

    env_file:
      - .env

    # 容器里的机器码会随容器重建而变，导致授权失效；
    # 所以授权类的配置统一从 .env 里的 OPSM_LICENSE_MACHINE 固定下来。
    # 日志量不大就不必限制；要限制可打开下面两行
    # logging:
    #   driver: json-file
    #   options: { max-size: "10m", max-file: "3" }
