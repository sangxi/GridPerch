<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>远程桌面 · GridPerch</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --border:#e4e8f0; --text:#1f2937; --muted:#6b7280; --primary:#2563eb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px; background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", -apple-system, Arial, sans-serif;
  }
  .card {
    max-width: 620px; margin: 0 auto; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 8px 24px rgba(16,24,40,.08); overflow: hidden;
  }
  .head { padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .head h1 { margin: 0 0 4px; font-size: 17px; }
  .head p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .body { padding: 18px 22px 22px; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; font-size: 13.5px; margin-bottom: 18px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: Consolas, monospace; word-break: break-all; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--primary); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; cursor: pointer; text-decoration: none;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: #eef2ff; color: #1e3a8a; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .tip { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; color: var(--muted); line-height: 1.8; }
  .tip b { color: var(--text); }
  code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-family: Consolas, monospace; }
  .err { color: #b91c1c; font-size: 13px; }
  #autoNote { font-size: 12px; color: var(--muted); margin-top: 8px; }
  /* 二次确认弹层：口令只在输入框和一次请求体里，关闭即清空 */
  .mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .mask.hide { display: none; }
  .dlg { width: 340px; background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 12px 32px rgba(16,24,40,.18); }
  .dlg h3 { margin: 0 0 6px; font-size: 15px; }
  .dlg p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .dlg input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
  .dlg input:focus { border-color: var(--primary); }
  .dlg .err { min-height: 18px; color: #b91c1c; font-size: 12px; margin-top: 6px; }
  .dlg .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .dlg .acts button { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
  .dlg .acts button.ok { background: var(--primary); border-color: var(--primary); color: #fff; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1 id="name">远程桌面</h1>
    <p id="sub">正在读取连接信息…</p>
  </div>
  <div class="body">
    <dl class="kv">
      <dt>地址</dt><dd id="addr">-</dd>
      <dt>用户名</dt><dd id="user">-</dd>
      <dt>关联主机</dt><dd id="bind">-</dd>
    </dl>
    <div class="row">
      <button class="btn" id="copyPwd">复制密码</button>
      <button class="btn ghost" id="copy">复制 mstsc 命令</button>
      <button class="btn ghost" id="copyUser">复制用户名</button>
    </div>
    <div id="autoNote"></div>
    <div class="tip" style="margin-top:16px">
      <b>怎么用：</b>按 <code>Win+R</code> 输入 <code>mstsc</code> 回车，把上面的地址粘进去，
      用户名和密码从这两个按钮复制过去。<br>
      <b>Mac / 手机：</b>装 Microsoft Remote Desktop，新建 PC 填上面的地址与用户名即可。<br>
      <b>端口不通：</b>确认目标机已开启「远程桌面」且防火墙放行 3389，必要时在地址后带端口（如 <code>IP:13389</code>）。
    </div>
    <div id="err" class="err"></div>
  </div>
</div>
<div id="mask" class="mask hide">
  <div class="dlg">
    <h3>确认身份</h3>
    <p>查看明文密码属于敏感操作，请再次输入当前登录账号的密码。</p>
    <input type="password" id="pwd" autocomplete="current-password" placeholder="当前账号密码">
    <div class="err" id="pwdErr"></div>
    <div class="acts">
      <button id="pwdCancel">取消</button>
      <button class="ok" id="pwdOk">确定</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var id = new URLSearchParams(location.search).get('id') || '';
  var nameEl = document.getElementById('name');
  var subEl = document.getElementById('sub');
  var addrEl = document.getElementById('addr');
  var userEl = document.getElementById('user');
  var bindEl = document.getElementById('bind');
  var copyBtn = document.getElementById('copy');
  var copyUserBtn = document.getElementById('copyUser');
  var copyPwdBtn = document.getElementById('copyPwd');
  var autoNote = document.getElementById('autoNote');
  var errEl = document.getElementById('err');
  var address = '';
  var username = '';

  // 二次确认：查看明文密码前再验一次当前登录账号的口令
  var mask = document.getElementById('mask');
  var pwdInput = document.getElementById('pwd');
  var pwdErr = document.getElementById('pwdErr');
  var pwdResolve = null;

  function askPassword() {
    return new Promise(function (resolve) {
      pwdInput.value = '';
      pwdErr.textContent = '';
      mask.classList.remove('hide');
      pwdResolve = resolve;
      setTimeout(function () { pwdInput.focus(); }, 30);
    });
  }
  function closePwd(val) {
    mask.classList.add('hide');
    pwdInput.value = '';
    var fn = pwdResolve;
    pwdResolve = null;
    if (fn) fn(val);
  }
  document.getElementById('pwdOk').addEventListener('click', function () {
    if (!pwdInput.value) { pwdErr.textContent = '请输入当前账号密码'; return; }
    closePwd(pwdInput.value);
  });
  document.getElementById('pwdCancel').addEventListener('click', function () { closePwd(null); });
  pwdInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('pwdOk').click(); }
  });

  // 统一走 clipboard API，失败就退回到 prompt（浏览器非 https 时没有 clipboard）
  function copyText(text, btn, doneLabel) {
    var restore = function () { btn.textContent = doneLabel || '复制密码'; };
    var ok = function () {
      btn.textContent = '已复制';
      setTimeout(restore, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(function () { window.prompt('复制下面的内容：', text); });
    } else {
      window.prompt('复制下面的内容：', text);
    }
  }

  function fail(msg) {
    subEl.textContent = '无法获取连接信息';
    errEl.textContent = msg;
  }

  if (!id) { fail('缺少账号 ID，请从「设备账号」页面点「桌面」进入。'); return; }

  fetch('/api/device-accounts', { credentials: 'same-origin' }).then(function (r) {
    if (r.status === 401) throw new Error('登录状态已失效，请先回到控制台登录。');
    return r.json();
  }).then(function (list) {
    list = Array.isArray(list) ? list : [];
    var acc = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) acc = list[i];
    if (!acc) throw new Error('设备账号不存在，或已被删除。');
    // 端口按协议取：RDP 账号用自己配的端口，SSH 账号一律按 3389，
    // 否则会把 IP:22 写进 .rdp，mstsc 连过去必然失败。
    var isRdp = String(acc.protocol || '').toLowerCase() === 'rdp';
    var port = isRdp ? (acc.port || 3389) : 3389;
    address = acc.host + (port === 3389 ? '' : ':' + port);
    nameEl.textContent = acc.name || '远程桌面';
    subEl.textContent = isRdp
      ? '用系统自带的「远程桌面连接」打开，凭据由 Windows 自行询问'
      : '该账号是 ' + String(acc.protocol || 'ssh').toUpperCase() + ' 协议，远程桌面按默认端口 3389 连接';
    addrEl.textContent = acc.host + ':' + port;
    username = acc.username || '';
    userEl.textContent = username || '（未填写）';
    bindEl.textContent = acc.bindHost || '未关联';
    copyUserBtn.disabled = !username;
    copyPwdBtn.disabled = !acc.hasSecret;
    autoNote.textContent = acc.hasSecret
      ? '密码已加密保存，点「复制密码」才解密一次。'
      : '这条账号还没有保存密码，连不上远程桌面。';
  }).catch(function (e) {
    fail(String(e.message || e));
  });

  copyBtn.addEventListener('click', function () {
    copyText('mstsc /v:' + address, copyBtn, '复制 mstsc 命令');
  });
  copyUserBtn.addEventListener('click', function () {
    if (username) copyText(username, copyUserBtn, '复制用户名');
  });
  copyPwdBtn.addEventListener('click', function () {
    askPassword().then(function (pwd) {
      if (!pwd) return;
      copyPwdBtn.disabled = true;
      fetch('/api/device-accounts/' + encodeURIComponent(id) + '/secret', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd }),
        credentials: 'same-origin'
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || j.ok === false) throw new Error(j.msg || ('HTTP ' + r.status));
          return j;
        });
      }).then(function (j) {
        copyText(String(j.secret || ''), copyPwdBtn, '复制密码');
      }).catch(function (e) {
        autoNote.textContent = '取密码失败：' + String(e.message || e);
      }).then(function () { copyPwdBtn.disabled = false; });
    });
  });
})();
</script>
</body>
</html>
